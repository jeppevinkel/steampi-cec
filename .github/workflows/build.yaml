name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            arch: arm64
          - os: ubuntu-26.04
            arch: x64
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y g++ cmake ninja-build pkg-config libcec-dev libp8-platform-dev libudev-dev
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - run: cp build/steampi_cec steampi-cec-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          path: steampi-cec-${{ matrix.arch }}
          archive: false
      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y gh
          gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create nightly --repo "${{ github.repository }}" \
                 --title "Nightly" --notes "Latest build" --prerelease \
            || true
          gh release upload nightly steampi-cec-${{ matrix.arch }} --clobber --repo "${{ github.repository }}"