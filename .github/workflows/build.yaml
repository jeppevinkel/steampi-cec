name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            arch: arm64
          - os: ubuntu-26.04
            arch: x64
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Debian trixie, the same as Raspberry Pi OS on the Pi; tries several registries.
      - name: Get a Debian trixie image
        run: .github/scripts/pull-debian-image.sh

      - name: Build
        run: |
          docker run --rm -v "$PWD:/source" -w /source -e HOST_IDS="$(id -u):$(id -g)" "$BUILD_IMAGE" bash -euo pipefail -c '
            apt-get update
            apt-get install -y g++ cmake ninja-build pkg-config libcec-dev libp8-platform-dev libudev-dev
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            chown -R "$HOST_IDS" build   # files made in the container belong to root otherwise
          '
          cp build/steampi_cec steampi-cec-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          path: steampi-cec-${{ matrix.arch }}
          archive: false

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y gh; }   # preinstalled on GitHub's images
          gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create nightly --repo "${{ github.repository }}" \
                 --title "Nightly" --notes "Latest build" --prerelease \
            || true
          gh release upload nightly steampi-cec-${{ matrix.arch }} --clobber --repo "${{ github.repository }}"
