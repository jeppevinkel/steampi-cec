name: Jellyfin Desktop
# Builds the Jellyfin Desktop client as a Debian package for the Pi (arm64, trixie). Upstream
# publishes no ARM Linux build. Runs when the recipe or the pinned version changes, or on demand.
on:
  push:
    paths:
      - deploy/jellyfin-desktop/**
      - .github/workflows/jellyfin-desktop.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get a Debian trixie image
        run: .github/scripts/pull-debian-image.sh

      - name: Build the package
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/deploy/jellyfin-desktop:/recipe:ro" -v "$PWD/packages:/output" \
              -e HOST_IDS="$(id -u):$(id -g)" "$BUILD_IMAGE" \
              bash -euo pipefail -c '/recipe/build-package.sh /output; chown -R "$HOST_IDS" /output'

      - uses: actions/upload-artifact@v7
        with:
          name: jellyfin-desktop-arm64
          path: packages/*.deb

      # install-steampi.sh downloads the package from this release under a fixed name; the version
      # is in the package itself.
      - name: Publish to the jellyfin-desktop release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y gh; }
          cp packages/jellyfin-desktop_*_arm64.deb jellyfin-desktop_arm64.deb
          version="$(dpkg-deb -f jellyfin-desktop_arm64.deb Version)"
          gh release view jellyfin-desktop --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create jellyfin-desktop --repo "${{ github.repository }}" --prerelease \
                 --title "Jellyfin Desktop for the Pi" \
                 --notes "Jellyfin Desktop built for Raspberry Pi OS (arm64, trixie) by the jellyfin-desktop workflow. Installed by pitv-update." \
            || true
          gh release upload jellyfin-desktop jellyfin-desktop_arm64.deb --clobber --repo "${{ github.repository }}"
          echo "Published Jellyfin Desktop ${version}"
